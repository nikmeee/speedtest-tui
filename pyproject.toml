[project]
name = "speedtest-tui"
version = "0.1.0"
description = "Стильный замер скорости интернета прямо в терминале — через Cloudflare"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jora" }]
keywords = ["speedtest", "tui", "terminal", "network", "cloudflare", "bufferbloat"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/nikmeee/speedtest-tui"

[project.scripts]
speedtest = "speedtest_tui.app:cli"
speedtest-tui = "speedtest_tui.app:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
